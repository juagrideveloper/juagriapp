#Gradle
org.gradle.jvmargs=-Xmx4096m -Dkotlin.daemon.jvm.options\="-Xmx4096m"

#Kotlin
kotlin.code.style=official

#MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true

#Android
android.useAndroidX=true
android.targetSdk=35
android.compileSdk=35
android.minSdk=24

#Versions
kotlin.version=1.9.21
agp.version=8.7.3
compose.version=1.5.11
sqlDelight.version=2.0.1

#AppVersions
cdo.version.code=22
cdo.version.name=v2.0.9
dealer.version.code=29
dealer.version.name=v1.0.19
staff.version.code=13
staff.version.name=v2.0.0

#Cache
compose.kotlin.native.cacheKind=none
kotlin.mpp.applyDefaultHierarchyTemplate=false
android.suppressUnsupportedCompileSdk=34

kotlin.mpp.androidGradlePluginCompatibility.nowarn=true